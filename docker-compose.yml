services:
  api:
    build: .
    ports:
      - "8000:8000"
    # 作用：把 .env 里的所有键值对注入容器；效果：不用一条条写 environment，新增配置项无需改本文件。
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/ask
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - api
    restart: unless-stopped